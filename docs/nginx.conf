# I'm Still Mine — imstillmine.com (Nginx)
# IPv4 only, as decided: there is no "listen [::]" line, and the domain must have NO AAAA record.
#
# 1) Site files      -> /var/www/imstillmine/        (contents of site/, or coming-soon/ before launch)
# 2) Private API     -> 127.0.0.1:8080  (private repository, started with uvicorn behind this proxy)
# 3) sudo ln -s /etc/nginx/sites-available/imstillmine.conf /etc/nginx/sites-enabled/
#    sudo certbot --nginx -d imstillmine.com -d www.imstillmine.com
#    sudo nginx -t && sudo systemctl reload nginx

# Extra safety net in front of the API's own limits (the API enforces 5/day per IP, 30 s apart, 50/day per /24)
limit_req_zone $binary_remote_addr zone=imsm_api:10m rate=30r/m;

server {
    listen 80;
    server_name imstillmine.com www.imstillmine.com;
    return 301 https://imstillmine.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imstillmine.com www.imstillmine.com;
    # ssl_certificate / ssl_certificate_key : filled in by certbot

    root /var/www/imstillmine;
    index index.html;

    access_log off;                     # no connection logs
    error_log /var/log/nginx/imstillmine.error.log crit;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The page can only talk to this server (connect-src 'self'), never to a third party.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location ~ \.mjs$  { default_type text/javascript; }
    location ~ \.wasm$ { default_type application/wasm; }
    location ~ \.bin$  { default_type application/octet-stream; }

    location /api/ {
        limit_req zone=imsm_api burst=20 nodelay;
        client_max_body_size 300k;      # one "street" (piece) at a time
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8080;
    }

    location / { try_files $uri $uri/ /index.html; }
}
