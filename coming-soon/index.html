const L={"fr": ["Bientôt en ligne", "Ton corps. Tes images. Ton choix.", "Un site gratuit et sans but lucratif, pour toute personne qui pense à vendre du contenu intime en ligne, ou qui découvre de fausses images ou des images volées d'elle-même.", "Bientôt : un soutien psychologique et psychiatrique gratuit par des soignants bénévoles, des outils pour vérifier une photo, et de l'aide pour la faire retirer. Pas de pub, pas de pistage, pas de dons pour nous.", "Vous êtes psychologue ou psychiatre ? Rejoignez-nous :", "Le code est ouvert :", "En danger immédiat ? Appelle le 112."], "en": ["Coming soon", "Your body. Your images. Your choice.", "A free, non-profit site for anyone thinking about selling intimate content online, or finding fake or stolen intimate images of themselves.", "Soon: free psychological and psychiatric support from volunteer professionals, tools to check a photo, and help to get it removed. No ads, no tracking, no donations to us.", "Are you a psychologist or psychiatrist? Join us:", "The code is open:", "In immediate danger? Call 112."], "es": ["Muy pronto", "Tu cuerpo. Tus imágenes. Tu decisión.", "Un sitio gratuito y sin ánimo de lucro para cualquier persona que piense en vender contenido íntimo en internet, o que descubra imágenes falsas o robadas de sí misma.", "Pronto: apoyo psicológico y psiquiátrico gratuito de profesionales voluntarios, herramientas para comprobar una foto y ayuda para retirarla. Sin anuncios, sin rastreo, sin donaciones para nosotros.", "¿Eres psicólogo o psiquiatra? Únete:", "El código es abierto:", "¿En peligro inmediato? Llama al 112."], "pt": ["Brevemente", "O teu corpo. As tuas imagens. A tua escolha.", "Um site gratuito e sem fins lucrativos para qualquer pessoa que pense em vender conteúdo íntimo online, ou que descubra imagens falsas ou roubadas de si própria.", "Em breve: apoio psicológico e psiquiátrico gratuito de profissionais voluntários, ferramentas para verificar uma foto e ajuda para a remover. Sem publi এ কল করুন।"], "id": ["Segera hadir", "Tubuhmu. Gambarmu. Pilihanmu.", "Situs gratis dan nirlaba untuk siapa pun yang berpikir menjual konten intim secara online, atau menemukan gambar intim palsu atau curian tentang dirinya.", "Segera: dukungan psikologis dan psikiatris gratis dari tenaga profesional sukarela, alat untuk memeriksa foto, dan bantuan untuk menghapusnya. Tanpa iklan, tanpa pelacakan, tanpa donasi untuk kami.", "Anda psikolog atau psikiater? Bergabunglah:", "Kodenya terbuka:", "Dalam bahaya saat ini? Hubungi 112."], "vi": ["Sắp ra mắt", "Cơ thể bạn. Hình ảnh của bạn. Lựa chọn của bạn.", "Một trang web miễn phí, phi lợi nhuận dành cho bất kỳ ai đang nghĩ đến việc bán nội dung riêng tư trên mạng, hoặc phát hiện ảnh riêng tư giả mạo hay bị đánh cắp của chính mình.", "Sắp có: hỗ trợ tâm lý và tâm thần miễn phí từ các chuyên gia tình nguyện, công cụ kiểm tra ảnh, và giúp gỡ ảnh xuống. Không quảng cáo, không theo dõi, không nhận quyên góp cho chúng tôi.", "Bạn là nhà tâm lý hoặc bác sĩ tâm thần? Hãy tham gia:", "Mã nguồn được công khai:", "Đang gặp nguy hiểm ngay lúc này? Gọi 112."], "ur": ["جلد آ رہا ہے", "آپ کا جسم۔ آپ کی تصاویر۔ آپ کا فیصلہ۔", "ایک مفت، غیر منافع بخش سائٹ، ہر اس شخص کے لیے جو آن لائن نجی مواد بیچنے کا سوچ رہا ہے، یا جسے اپنی جعلی یا چوری شدہ نجی تصاویر ملی ہیں۔", "جلد: رضاکار ماہرین سے مفت نفسیاتی اور ذہنی صحت کی مدد، تصویر جانچنے کے ٹولز، اور اسے ہٹوانے میں مدد۔ کوئی اشتہار نہیں، کوئی ٹریکنگ نہیں، ہمارے لیے کوئی عطیہ نہیں۔", "کیا آپ ماہرِ نفسیات یا سائیکاٹرسٹ ہیں؟ ہمارے ساتھ شامل ہوں:", "کوڈ کھلا ہے:", "فوری خطرے میں ہیں؟ 112 پر کال کریں۔"]};
